<!DOCTYPE html>
<html>
<head>
    <title>Love Text</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffeef8; /* Розовый фон */
            padding: 20px;
            margin: 0;
            position: relative; /* для нижней картинки */
            min-height: 100vh;
        }

        p {
            font-size: 24px;
            color: #000000; /* Чёрный текст */
            line-height: 1.6;
            margin-top: 50px;
        }

        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #ff6699;
            color: white;
        }

        button:hover {
            background-color: #ff3366;
        }

        /* Маленькая картинка в нижнем правом углу */
        .corner-img {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 80px;      /* маленький размер */
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <p>{{ content|safe }}</p>

    <a href="/gift"><button>Back</button></a>

    <!-- Маленькая картинка в углу -->
    <img src="{{ url_for('static', filename='basic/lovepink.jpg') }}" alt="Love Pink" class="corner-img">
</body>
</html>
