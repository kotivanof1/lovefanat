<!DOCTYPE html>
<html>
<head>
    <title>No Thanks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffeef8; /* Розовый фон */
            padding: 20px;
            margin: 0;
            position: relative;
            min-height: 100vh;
        }

        h2 {
            font-size: 32px;
            color: #ff3366;
            margin-top: 50px;
        }

        /* Основная картинка */
        .main-img {
            width: 250px;
            height: auto;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Вторая декоративная картинка */
        .secondary-img {
            width: 150px;
            height: auto;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #ff6699;
            color: white;
        }

        button:hover {
            background-color: #ff3366;
        }

        /* Маленькая картинка в нижнем правом углу */
        .corner-img {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 80px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h2>I promise you'll like it</h2>

    <!-- Две картинки из отдельной папки no_photos -->
    <img src="{{ url_for('static', filename='no_photos/plakiplaki.jpg') }}" alt="Main Gift" class="main-img">
    <img src="{{ url_for('static', filename='no_photos/tishetishe.jpg') }}" alt="Decorative" class="secondary-img">

    <!-- Кнопка Try -->
    <div>
        <a href="/"><button>Try</button></a>
    </div>

    <!-- Маленькая картинка в нижнем правом углу -->
    <img src="{{ url_for('static', filename='basic/lovepink.jpg') }}" alt="Love Pink" class="corner-img">
</body>
</html>
