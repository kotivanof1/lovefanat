<!DOCTYPE html>
<html>
<head>
    <title>Song</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #ffeef8; /* розовый фон */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        h2 {
            color: #ff3366;
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            width: 80%;
            max-width: 800px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .side-message {
            position: absolute;
            top: 10px;
            right: -220px; /* сдвиг справа от видео */
            width: 200px;
            background-color: rgba(255, 102, 153, 0.2);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            color: #ff3366;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #ff6699;
            color: white;
        }

        button:hover {
            background-color: #ff3366;
        }

        @media (max-width: 800px) {
            .side-message {
                position: static;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <h2>This song tells everything about you &lt;3</h2>

    <div class="video-container">
        <iframe src="{{ url }}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <div class="side-message">Message for u: 00:52 - 1:03</div>
    </div>

    <a href="/gift"><button>Back</button></a>
</body>
</html>
