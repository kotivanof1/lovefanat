<!DOCTYPE html>
<html>
<head>
    <title>Photos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- важно для телефона -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff0f5;
            padding: 20px;
            margin: 0;
        }
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .photo-grid img {
            width: 100%;
            max-width: 300px;      /* ограничение ширины */
            height: 200px;         /* фиксированная высота */
            object-fit: cover;      /* сохраняем пропорции и обрезаем лишнее */
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .photo-grid img:hover {
            transform: scale(1.05); /* эффект увеличения при наведении */
        }
        .memory-text {
            font-size: 36px;
            font-weight: bold;
            color: #ff3366;
            margin: 40px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #ff6699;
            color: white;
        }
        button:hover {
            background-color: #ff3366;
        }

        /* Адаптивность под телефон */
        @media (max-width: 600px) {
            .photo-grid img {
                height: 150px;     /* меньше по высоте для маленького экрана */
            }
            .memory-text {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <h1>Photo Memories</h1>

    <!-- Первая часть фотографий -->
    <div class="photo-grid">
        {% for photo in photos[:photos|length//2] %}
            <img src="{{ url_for('static', filename='basic/' ~ photo) }}" alt="Photo">
        {% endfor %}
    </div>

    <!-- Красивый текст между фотографиями -->
    <div class="memory-text">It’s our memories ❤️</div>

    <!-- Вторая часть фотографий -->
    <div class="photo-grid">
        {% for photo in photos[photos|length//2:] %}
            <img src="{{ url_for('static', filename='basic/' ~ photo) }}" alt="Photo">
        {% endfor %}
    </div>

    <a href="/gift"><button>Back</button></a>
</body>
</html>
