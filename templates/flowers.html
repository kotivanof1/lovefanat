<!DOCTYPE html>
<html>
<head>
    <title>Flowers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffeef8; /* Розовый фон */
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            position: relative;
        }

        h2 {
            font-size: 28px;
            color: #ff3366;
            margin-top: 20px;
        }

        .flower-img {
            width: 180px; /* уменьшаем размер картинок */
            height: auto;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #ff6699;
            color: white;
        }

        button:hover {
            background-color: #ff3366;
        }

        /* Маленькая картинка в нижнем правом углу */
        .corner-img {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 80px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h2>{{ text_message }}</h2> <!-- Твой текст -->

    <!-- Картинки цветов -->
    {% for flower in flowers %}
        <img src="{{ url_for('static', filename='flowers/' + flower) }}" alt="Flower" class="flower-img">
    {% endfor %}

    <!-- Кнопка назад -->
    <div>
        <a href="/gift"><button>Back</button></a>
    </div>

    <!-- Маленькая картинка в углу -->
    <img src="{{ url_for('static', filename='basic/lovepink.jpg') }}" alt="Love Pink" class="corner-img">
</body>
</html>
